name: Build for Design Studio

on:
  workflow_dispatch:
  push:
    branches:
      - ai-chat-production-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint integration code
        run: npx eslint src/chat src/constants.js src/utils/basemap.js

      - name: Build application
        run: npm run build

      - name: Production safety smoke checks
        run: |
          set -euo pipefail
          grep -R -q 'dcc1c1c0f97f4e458199888b0fc63896' dist/assets
          grep -R -q 'Power Explorer Assistant' dist/assets
          if grep -R -E -q 'sk-ant-|sk-proj-|AIza[0-9A-Za-z_-]{20,}' dist/assets; then
            echo 'ERROR: possible provider credential found in browser bundle'
            exit 1
          fi
          if grep -R -q 'FeatureServer' dist/assets; then
            echo 'ERROR: runtime FeatureServer reference found in browser bundle'
            exit 1
          fi

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: regional-power-explorer-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
