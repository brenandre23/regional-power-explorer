name: Build for Design Studio

on:
  workflow_dispatch:
  push:
    branches:
      - ai-chat-production-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint integration code
        run: npx eslint src/chat src/constants.js src/utils/basemap.js

      - name: Build application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: regional-power-explorer-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
