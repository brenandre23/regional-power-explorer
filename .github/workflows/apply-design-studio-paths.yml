name: Apply Design Studio paths

on:
  push:
    branches:
      - design-studio-deployment
    paths:
      - '.github/workflows/apply-design-studio-paths.yml'
      - 'tools/apply_design_studio_paths.py'

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: design-studio-deployment

      - name: Apply path migration
        run: python tools/apply_design_studio_paths.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit migration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.js index.html src/
          git commit -m "Make app path-aware for Design Studio"
          git push origin design-studio-deployment
