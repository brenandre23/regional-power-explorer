name: Build for Design Studio

on:
  workflow_dispatch:
  push:
    branches:
      - ai-chat-production-integration

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Commit refreshed lockfile on feature branch
        if: github.ref_name == 'ai-chat-production-integration'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh AI integration lockfile"
          git push

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: regional-power-explorer-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
