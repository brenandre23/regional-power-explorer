name: Build final Design Studio path

on:
  push:
    branches:
      - design-studio-deployment
    paths:
      - '.github/workflows/build-final-design-studio-path.yml'
      - 'vite.config.js'
      - 'src/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: regional-power-explorer-dist-final-path
          path: dist/
          if-no-files-found: error
          retention-days: 7
